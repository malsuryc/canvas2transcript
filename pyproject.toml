[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-vids-to-transcripts"
version = "0.1.0"
description = "Clip authorized lecture audio and transcribe it locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["whisper-ctranslate2==0.5.8"]

[project.scripts]
lecture-transcripts = "lecture_transcripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]